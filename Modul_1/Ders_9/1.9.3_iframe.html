<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ders 9 - Site Harita Gömmek (iframe)</title>
  </head>
  <body>
    <h1>Site ve Harita Gömme (İframe)</h1>
    <h2>YouTube Videosu Gömme</h2>
    <iframe
      width="560"
      height="315"
      src="https://www.youtube.com/embed/lImA1ECsMeY?si=JgAVTGMy8R2HroRq"
      title="YouTube video player"
      frameborder="0"
      allow="
        accelerometer;
        autoplay;
        clipboard-write;
        encrypted-media;
        gyroscope;
        picture-in-picture;
        web-share;
      "
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen
    ></iframe>
  </body>
  <h2>Google Haritası Gömme</h2>
  <iframe
    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d24784.987867840704!2d34.38050545!3d39.0581!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x14d57b030eff4175%3A0xb431c81376d46836!2zTXVjdXIsIEvEsXLFn2VoaXI!5e0!3m2!1str!2str!4v1793126558573!5m2!1str!2str"
    width="600"
    height="450"
    style="border: 0"
    allowfullscreen=""
    loading="lazy"
    referrerpolicy="strict-origin-when-cross-origin"
    loading="lazy"
  ></iframe>
</html>
