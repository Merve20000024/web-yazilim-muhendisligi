<body>
    <h1>Sırasız Listeler</h1>
    <h2> <strong>Alışveriş Listesi</strong></h2>
<!-- Sırasız listeler de typ paramertesinin görevi CSS'e devredilmiştir -->
 <!-- CSS ile madde işaretini değiştirme yönetimini aşağıdaki kodda kullandık. -->
    <!-- Madde işaretini değiştirmek için disc, square, circle kullanılır. -->
     <!-- Madde işaretini kaldırmak için  none kullanılır -->
 <ul style="list-style:circle;">
        <li>Yumurta</li>
        <li>Süt</li>
        <li>Tam Buğday Ekmeği</li>
        <li>Kahve Çekirdeği</li>
    </ul>

    <!-- Hızlı liste eklemek için ul>li*5 yazabiliriz. -->
</body>

</html>
